<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小兒復健初診</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* layout: left = click-to-fill form in toggleable sections, right = live plain-text note that stays in view */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#F4F7F6; --band:#DCEBE6;
  --ink:#15231F; --ink2:#465650; --ink3:#748580; --rule:#CFD9D5;
  --accent:#17624F; --accent-soft:#DFF0EA; --on-accent:#FFFFFF;
  --delay:#B3362B; --delay-soft:#FBE7E4; --border:#9A6A00; --border-soft:#FBF0D2; --ok:#1F7A4D; --ok-soft:#E0F2E7;
  --sans:"IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#18211E; --sunk:#131B19; --band:#1E2E29;
  --ink:#E2EAE7; --ink2:#A9B7B2; --ink3:#7C8C87; --rule:#2B3833;
  --accent:#63C9AC; --accent-soft:#1B332C; --on-accent:#0B1513;
  --delay:#FF8A7D; --delay-soft:#3A1E1B; --border:#E9BC4E; --border-soft:#342A12; --ok:#6DD39C; --ok-soft:#18301F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#18211E; --sunk:#131B19; --band:#1E2E29;
  --ink:#E2EAE7; --ink2:#A9B7B2; --ink3:#7C8C87; --rule:#2B3833;
  --accent:#63C9AC; --accent-soft:#1B332C; --on-accent:#0B1513;
  --delay:#FF8A7D; --delay-soft:#3A1E1B; --border:#E9BC4E; --border-soft:#342A12; --ok:#6DD39C; --ok-soft:#18301F; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--rule)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-block:10px}
.brand{font-weight:700;font-size:17px;color:var(--accent);letter-spacing:.01em}
.brand small{font-weight:400;font-size:12.5px;color:var(--ink3);margin-left:8px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs a{text-decoration:none;color:var(--ink2);padding:5px 12px;border-radius:6px;font-weight:500}
.tabs a.on{background:var(--accent);color:var(--on-accent)}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:5px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.warn{border-color:var(--delay);color:var(--delay)}
.btn.sm{padding:2px 8px;font-size:12.5px}

.wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;padding-block:16px;align-items:start}
.form{min-width:0;display:flex;flex-direction:column;gap:14px}
.pick{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.pick h2{font-size:13px;margin:0 0 8px;font-weight:600;color:var(--ink2)}
.pick-row{display:flex;flex-wrap:wrap;gap:6px}
.pick-secs{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px}
.pick-secs label{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;white-space:nowrap}
.pick-secs input{accent-color:var(--accent)}

.sec{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.sec>h2{margin:0;padding:8px 14px;background:var(--band);font-size:15px;font-weight:600;color:var(--accent);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.sec>h2 small{font-weight:400;font-size:12.5px;color:var(--ink2)}
.sec-b{padding:10px 14px 12px;display:flex;flex-direction:column;gap:9px}
.hint{font-size:12.5px;color:var(--ink3);margin:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.fld{display:flex;flex-wrap:wrap;align-items:center;gap:5px;min-width:0}
.fld>.l{color:var(--ink2);font-size:13.5px;font-weight:500;white-space:nowrap}
.fld.wide{flex:1 1 100%}
.fld.wide input{flex:1}
input.t{border:0;border-bottom:1.5px solid var(--rule);background:transparent;padding:2px 3px;min-width:0;border-radius:0}
input.t:focus{outline:0;border-bottom-color:var(--accent)}
input.t::placeholder{color:var(--ink3);opacity:.7}
.suf{color:var(--ink3);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--rule);background:var(--sunk);border-radius:999px;padding:2px 10px;font-size:13.5px;color:var(--ink2);line-height:1.5}
.chip small{color:var(--ink3);font-size:11.5px;margin-left:4px}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.on small{color:inherit;opacity:.8}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:4px;padding:1px 7px;white-space:nowrap}
.badge.delay{background:var(--delay-soft);color:var(--delay)} .badge.border,.badge.watch{background:var(--border-soft);color:var(--border)} .badge.normal{background:var(--ok-soft);color:var(--ok)} .badge.info{background:var(--accent-soft);color:var(--accent)}
.calc{font-size:13px;color:var(--ink2);background:var(--sunk);border-radius:6px;padding:6px 10px}
.calc b{color:var(--ink)}

/* milestones */
.dom{border-top:1px dashed var(--rule);padding-top:9px}
.dom:first-of-type{border-top:0;padding-top:0}
.dom-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:6px}
.dom-h b{font-size:14px}
.dom-h .sp{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.mi{display:flex;flex-wrap:wrap;gap:4px}
.m{border:1px solid var(--rule);background:var(--sunk);border-radius:6px;padding:2px 8px;font-size:13px;text-align:left;color:var(--ink2);line-height:1.5}
.m i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--ink3);margin-right:5px;font-variant-numeric:tabular-nums}
.m.y{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)} .m.y::after{content:" ✓";color:var(--ok);font-weight:700}
.m.n{background:var(--delay-soft);border-color:var(--delay);color:var(--ink)} .m.n::after{content:" ✗";color:var(--delay);font-weight:700}
.grp{font-size:12.5px;font-weight:600;color:var(--ink2);margin:4px 0 2px;display:flex;gap:8px;align-items:center}

/* assessment */
.sug{display:flex;flex-direction:column;gap:6px}
.sg{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:6px;padding:7px 10px;background:var(--sunk)}
.sg.added{border-left-color:var(--ok);opacity:.7}
.sg .c{font-family:var(--mono);font-weight:500;white-space:nowrap}
.sg .w{font-size:12.5px;color:var(--ink2)}
.sg>div{flex:1;min-width:0}
.dxl{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.dxl li{display:flex;gap:8px;align-items:center}
.dxl input{flex:1}
.icd-res{max-height:210px;overflow:auto;border:1px solid var(--rule);border-radius:6px}
.icd-res button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:var(--surface);padding:5px 10px;font-size:13.5px}
.icd-res button:hover{background:var(--accent-soft)}
.icd-res button span{font-family:var(--mono);margin-right:8px}
.icd-res button small{color:var(--ink3);margin-left:6px}

/* note */
.note{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);background:var(--surface);border:1px solid var(--rule);border-radius:10px;display:flex;flex-direction:column;height:calc(100vh - 84px - env(safe-area-inset-top,0px));min-width:0}
.note-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule)}
.note-h b{margin-right:auto}
.note-h label{font-size:12.5px;color:var(--ink2);display:inline-flex;gap:4px;align-items:center}
#note{flex:1;min-height:320px;width:100%;border:0;resize:none;background:var(--surface);padding:12px 14px;font-family:var(--mono);font-size:13px;line-height:1.6;white-space:pre-wrap;overflow:auto}
#note:focus{outline:0}
.note-f{font-size:12px;color:var(--ink3);padding:6px 12px;border-top:1px solid var(--rule)}
.mbar{display:none}

/* tools */
.tools{padding-block:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px;align-items:start}
.tools .sec.full{grid-column:1/-1}
.tool-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.out{min-height:26px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
table.r{border-collapse:collapse;width:100%;font-size:13.5px}
table.r th,table.r td{border-bottom:1px solid var(--rule);padding:5px 8px;text-align:left;vertical-align:top}
table.r th{font-weight:600;color:var(--ink2);font-size:12.5px;background:var(--sunk)}
table.r td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
details{border-top:1px solid var(--rule);padding:8px 0}
details:first-of-type{border-top:0}
summary{font-weight:600;cursor:pointer}
details ul{margin:6px 0 0;padding-left:1.2em}
details li{margin:3px 0}
.fix{background:var(--border-soft);color:var(--ink);border-radius:3px;padding:0 3px}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  .note{position:static;height:auto}
  #note{min-height:260px}
  .brand small{display:none}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:9;gap:8px;background:var(--surface);border-top:1px solid var(--rule);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .mbar .btn{flex:1;padding:8px}
  .wrap{padding-bottom:70px}
}
</style>

</head>
<body>
<header class="top"><div class="top-in gut">
  <span class="brand">小兒復健 · 初診<small>邊問邊點，右側即時生成病歷</small></span>
  <nav class="tabs"><a href="#intake" id="tab-intake">初診</a><a href="#tools" id="tab-tools">評量換算</a></nav>
  <button class="btn warn" id="clearBtn">清空，下一位</button>
</div></header>

<main id="v-intake" class="wrap gut">
  <div class="form" id="form"></div>
  <aside class="note" id="notePane">
    <div class="note-h"><b>病歷預覽</b><label><input type="checkbox" id="keepEmpty"> 保留空白欄位</label><button class="btn pri" id="copyBtn">複製病歷</button></div>
    <textarea id="note" readonly spellcheck="false" aria-label="病歷內容"></textarea>
    <div class="note-f">內容只留在這個分頁，關閉分頁即清除；請勿輸入姓名或病歷號。DA、DQ 與建議診斷為門診初估，需由你確認。</div>
  </aside>
</main>
<main id="v-tools" class="tools gut" hidden></main>
<div class="mbar"><button class="btn" id="jumpNote">看病歷</button><button class="btn pri" id="copyBtn2">複製病歷</button></div>

<script>
/* ---------- form schema ---------- */
const SECTIONS = [
{id:'info',t:'Patient Info',zh:'基本資料',rows:[
 [{id:'ageY',l:'Age',type:'num',suf:'y'},{id:'ageM',type:'num',suf:'m'},{id:'sex',type:'one',opts:['boy','girl']}],
 [{id:'with',l:'Come with',type:'multi',opts:['mother','father','both parents','grandmother','grandfather','nanny'],x:1}],
 [{id:'bh',l:'BH',type:'num',suf:'cm',w:5},{id:'bw',l:'BW',type:'num',suf:'kg',w:5},{id:'hc',l:'HC',type:'num',suf:'cm',w:5}],
 [{id:'und',l:'Underlying',type:'multi',opts:['nil','prematurity','cerebral palsy','epilepsy','Down syndrome','congenital heart disease'],x:1}],
 [{id:'cc',l:'C.C',type:'multi',opts:['gross motor delay|粗動作慢','fine motor delay|精細動作慢','speech delay|語言慢','unclear articulation|構音不清','stuttering|口吃','global developmental delay|整體慢','inattention / hyperactivity|不專心/過動','poor social interaction|社交互動差','learning difficulty|學習困難','clumsiness|動作笨拙','torticollis|斜頸','toe-in gait|內八','toe walking|墊腳尖','flat foot|扁平足','bow legs / knock knees|O/X型腿','scoliosis|脊柱側彎'],x:1}],
 [{id:'concern',l:'Most concern',type:'text',wide:1,ph:'家長最擔心的事'}],
 [{id:'refer',l:'Refer from',type:'one',opts:['pediatrics','well-baby clinic','teacher','other hospital','self-referred'],x:1}]
]},
{id:'birth',t:'Birth History',zh:'出生史',rows:[
 [{id:'g',l:'G',type:'num'},{id:'p',l:'P',type:'num'},{id:'ga',l:'GA',type:'num',suf:'wk',w:4},{id:'mode',type:'one',opts:['NSD','C/S','vacuum-assisted']}],
 [{id:'csr',l:'C/S reason',type:'multi',opts:['malpresentation|胎位不正','twins|雙胞胎','placenta previa|前置胎盤','macrosomia|胎兒太大','previous C/S|前次剖腹','fetal distress|胎兒窘迫','prolonged labor|產程遲滯'],x:1,when:f=>f.mode==='C/S'}],
 [{id:'bbw',l:'BBW',type:'num',suf:'gm',w:6}],
 [{id:'peri',l:'Perinatal history',type:'multi',opts:['uneventful','NICU admission','neonatal jaundice s/p phototherapy','respiratory distress','intubation','IVH','PVL','asphyxia / HIE','neonatal seizure','hypoglycemia','sepsis','GDM','preeclampsia','PPROM'],x:1}],
 [{id:'hosp',l:'Hospitalization',type:'one',opts:['nil'],x:1}],
 [{id:'opd',l:'OPD follow-up',type:'one',opts:['nil'],x:1,ph:'科別 / 醫院'}],
 [{id:'oae',l:'OAE 聽力篩檢',type:'one',opts:['passed','failed','unknown']}]
]},
{id:'dev',t:'Developmental Milestones',zh:'里程碑病史（家長回憶）',note:'填年齡，例如 7m、1y2m；還不會填 not yet。',rows:[
 [{id:'d_sit',l:'GM　sit without support',type:'text',w:6,ph:'7–9m'},{id:'d_stand',l:'stand',type:'text',w:6,ph:'9–12m'},{id:'d_walk',l:'walk',type:'text',w:6,ph:'12–15m'},{id:'d_jump',l:'jump',type:'text',w:6,ph:'2–2.5y'},{id:'d_stair',l:'stairs',type:'text',w:6,ph:'18–24m'}],
 [{id:'d_grasp',l:'FM　grasp',type:'text',w:6,ph:'3–4m'},{id:'d_pincer',l:'pincer grasp',type:'text',w:6,ph:'9–12m'},{id:'d_block',l:'throw ball / piling up',type:'text',w:6,ph:'18m'},{id:'d_knob',l:'door knob / turn page',type:'text',w:6,ph:'2y'}],
 [{id:'d_word',l:'Speech　first word',type:'text',w:6,ph:'12m'},{id:'d_phrase',l:'phrase & short sentences',type:'text',w:6,ph:'2y'}],
 [{id:'d_regress',l:'Regression',type:'one',opts:['no','yes'],x:1}],
 [{id:'feed',l:'Feeding 副食品',type:'multi',opts:['milk only','puree','soft solid','regular solid diet','picky eater|挑食','chewing difficulty|咀嚼差','choking|易嗆','drooling|流口水','still bottle feeding','pacifier use|奶嘴'],x:1}]
]},
{id:'school',t:'School / Early Intervention',zh:'就學與早療',rows:[
 [{id:'sch',l:'School',type:'one',opts:['not yet','public daycare|公托','private daycare|私托','public preschool|公幼','private preschool|私幼','elementary school'],x:1,ph:'年級'}],
 [{id:'cls',l:'Class',type:'multi',opts:['regular class|普通班','special education class|特教班','itinerant service|巡迴輔導','resource room|資源班','inclusive class|融合班']}],
 [{id:'perf',l:'School performance',type:'text',wide:1,ph:'學業 / 體育 / 老師回饋'}],
 [{id:'ei',l:'Early intervention',type:'multi',opts:['none','PT','OT','ST','psychology'],x:1,ph:'地點、頻率'}]
]},
{id:'family',t:'Family',zh:'家庭',rows:[
 [{id:'fa_age',l:'Father',type:'num',suf:'y/o',w:3},{id:'fa_edu',type:'one',opts:['junior high','senior high','college','master','PhD']},{id:'fa_job',type:'text',w:10,ph:'工作'}],
 [{id:'mo_age',l:'Mother',type:'num',suf:'y/o',w:3},{id:'mo_edu',type:'one',opts:['junior high','senior high','college','master','PhD']},{id:'mo_job',type:'text',w:10,ph:'工作'}],
 [{id:'sib',l:'Siblings',type:'one',opts:['only child'],x:1,ph:'排行、手足發展'}],
 [{id:'fhx',l:'Family history',type:'multi',opts:['nil','developmental delay','ASD','ADHD','speech delay','epilepsy','intellectual disability'],x:1}],
 [{id:'cg',l:'Caregiver',type:'multi',opts:['mother','father','grandparents','nanny']},{id:'cg_t',type:'one',opts:['daytime|日間','nighttime|夜間','24 hr','weekdays|上班日']}],
 [{id:'care',l:'Care',type:'multi',opts:['basic care','playing together regularly|陪玩','reading regularly|看書','parent-child center|親子館','park|公園','screen time > 1 hr/day|3C']},{id:'lang',l:'Home language',type:'multi',opts:['Mandarin','Taiwanese','English'],x:1}]
]},
{id:'ms',t:'Developmental Assessment',zh:'里程碑檢核 → 估計 DA / DQ',custom:'ms'},
{id:'pe',t:'PE Summary',zh:'理學檢查',rows:[
 [{id:'pe_gen',l:'General',type:'multi',opts:['alert','cooperative','shy','irritable','restless during visit','no dysmorphic feature'],x:1}],
 [{id:'pe_eye',l:'Eye contact',type:'one',opts:['good','fair','poor']},{id:'pe_name',l:'Response to name',type:'one',opts:['consistent','inconsistent','absent']},{id:'pe_ja',l:'Joint attention',type:'one',opts:['present','limited','absent']}],
 [{id:'pe_tone',l:'Muscle tone',type:'multi',opts:['normal','hypotonia','hypertonia','spasticity','dystonia'],x:1,ph:'部位'}],
 [{id:'pe_rom',l:'ROM',type:'one',opts:['full'],x:1,ph:'受限部位'},{id:'pe_mp',l:'Muscle power',type:'one',opts:['grossly normal'],x:1,ph:'無力部位'}],
 [{id:'pe_dtr',l:'DTR',type:'one',opts:['normal (++)','hyperreflexia','hyporeflexia']},{id:'pe_prim',l:'Primitive reflex',type:'one',opts:['integrated','persistent'],x:1,ph:'哪些'}],
 [{id:'pe_gait',l:'Gait',type:'multi',opts:['normal','not yet ambulatory','wide-based','toe walking','in-toeing','out-toeing','crouch','Trendelenburg','limping'],x:1}],
 [{id:'pe_post',l:'Postural reaction',type:'multi',opts:['head righting (+)','protective extension (+)','parachute (+)','delayed'],x:1}]
]},
{id:'speech',t:'Speech & Articulation',zh:'構音、口腔動作、流暢度',rows:[
 [{id:'sp_int',l:'Intelligibility',type:'one',opts:['< 50%','50–75%','75–90%','> 90%']},{id:'sp_comp',l:'Comprehension',type:'one',opts:['age-appropriate','limited']}],
 [{id:'sp_err',l:'Error sounds',type:'multi',opts:['ㄅ','ㄇ','ㄉ','ㄋ','ㄍ','ㄏ','ㄆ','ㄊ','ㄎ','ㄌ','ㄈ','ㄐ','ㄒ','ㄑ','ㄗ','ㄙ','ㄘ','ㄓ','ㄔ','ㄕ','ㄖ'],x:1,ph:'替代/省略型態'}],
 [{id:'sp_oral',l:'Oral motor',type:'multi',opts:['normal','drooling','poor chewing','limited tongue mobility','tongue-tie','hypernasality','cleft lip/palate','malocclusion'],x:1}],
 [{id:'sp_flu',l:'Fluency',type:'multi',opts:['fluent','syllable repetition','prolongation','blocks','secondary behavior (blinking, fist, stomping)','awareness / avoidance','> 6 months'],x:1}]
]},
{id:'asd',t:'ASD Checklist',zh:'DSM-5 特徵勾選',custom:'asd'},
{id:'adhd',t:'ADHD Checklist',zh:'DSM-5 症狀勾選（≥6 個月）',custom:'adhd'},

<script>
(function(){

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY='pedintake-v1';
const FIELDS={}; SECTIONS.forEach(s=>(s.rows||[]).forEach(r=>r.forEach(f=>FIELDS[f.id]=f)));
const fresh=()=>({on:Object.fromEntries(PRESETS[0][1].map(i=>[i,true])),f:{},ms:{},st:{},asd:{},adI:{},adH:{},dx:[],plan:[],tests:[],showAll:false,keep:false});

try{const r=sessionStorage.getItem(KEY); if(r) S=Object.assign(fresh(),JSON.parse(r));}catch(e){}
const save=()=>{try{sessionStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};

/* ---------- values ---------- */
const num=id=>{const v=S.f[id]; return v===''||v==null||isNaN(+v)?null:+v;};
const en=o=>o.split('|')[0];
function V(id){
  const f=FIELDS[id]; if(!f) return S.f[id]||'';
  if(f.type==='pair'){const r=S.f[id+'_r'],l=S.f[id+'_l']; return (r||l)?`${r||'?'}/${l||'?'}`:'';}
  if(f.type==='multi') return [...(S.f[id]||[]),S.f[id+'_x']].filter(Boolean).join(', ');
  if(f.type==='one') return [S.f[id],S.f[id+'_x']].filter(Boolean).join(', ');
  return S.f[id]||'';
}
const CA=()=>{const y=num('ageY'),m=num('ageM'); return y==null&&m==null?null:(y||0)*12+(m||0);};
const corr=()=>{const ca=CA(),ga=num('ga'); if(ca==null||ga==null||ga>=37||ca>=24) return null; return Math.max(0,Math.round((ca-(40-ga)*7/30.4375)*10)/10);};
const AA=()=>{const c=corr(); return c!=null?c:CA();};
const fmtM=m=>m<24?`${Math.round(m*10)/10}m`:`${Math.floor(m/12)}y${Math.round(m%12)?Math.round(m%12)+'m':''}`;
const ageStr=()=>{const y=num('ageY'),m=num('ageM'); return (y?y+'y':'')+(m||(!y&&m===0)?m+'m':'');};
const bbwClass=()=>{const b=num('bbw'); return b==null?'':b<1000?'ELBW':b<1500?'VLBW':b<2500?'LBW':'';};

function domCalc(d){

  if(!pass.length&&!fail.length) return null;
  const ff=fail.length?Math.min(...fail.map(x=>x[0])):Infinity;
  const below=pass.filter(x=>x[0]<ff);
  const da=below.length?Math.max(...below.map(x=>x[0])):null;

function asdG(){const g={}; ASD.forEach((a,i)=>{if(S.asd[i]) g[a[0]]=(g[a[0]]||0)+1;}); const A=['A1','A2','A3'].filter(k=>g[k]).length,B=['B1','B2','B3','B4'].filter(k=>g[k]).length; return {g,A,B,any:Object.keys(g).length>0};}

function leFind(){
  const o=[], ca=CA(), p=k=>[num(k+'_r'),num(k+'_l')];

  else if(u[0]!=null&&u[1]!=null&&Math.abs(u[0]-u[1])>=2) o.push(['M21.70',`Umbilicus–MM 差 ${Math.abs(u[0]-u[1]).toFixed(1)} cm 但 ASIS–MM 未達 2 cm：功能性長短腳，留意骨盆與脊柱`]);

  if((gait.includes('in-toeing')||cc.includes('toe-in gait'))&&!o.some(x=>/Q65|M21\.86|Q66\.2/.test(x[0]))) o.push(['R26.89','內八：4 歲前可為正常；請量 hip IR/ER、thigh-foot angle、heel bisector 找出層級']);

}
const icdName=c=>(ICD.find(x=>x[0]===c)||[])[1]||'';
function suggest(){

  const dl=[motor&&'動作',del('lang')&&'語言',del('cog')&&'認知',del('soc')&&'社會情緒'].filter(Boolean);

  if(S.on.tort&&(S.f.t_side||cc.includes('torticollis'))){ add(/^palpable/.test(S.f.t_mass||'')||(ca!=null&&ca<12)?'Q68.0':'M43.6','斜頸'+(ca!=null&&ca>=12?'；一歲後才出現需排除眼源性、頸椎與後顱窩病灶':'')); if((S.f.t_assoc||[]).includes('plagiocephaly')) add('Q67.3','合併斜頭'); }
  if(S.on.le||cc.some(x=>/toe|flat|bow/.test(x))) leFind().forEach(x=>add(x[0],x[1]));
  if(S.on.sco){ const cb=num('s_cobb'); if(cb!=null&&cb>=10){ const nm=und.includes('cerebral palsy');
      add(nm?'M41.40':ca==null?'M41.129':ca<36?'M41.00':ca<120?'M41.119':'M41.129',`Cobb ${cb}°：`+(cb<20?'< 20° 運動治療與追蹤':cb<=40?'20–40° 背架（T7 以上 Milwaukee，T8 以下 Boston 等）':'> 40° 考慮手術')); }
    else if(cb!=null) info(`Cobb ${cb}° 未達 10°，不符合脊柱側彎定義`); }
  if(und.includes('cerebral palsy')) add('G80.9','Underlying：CP，請依型態改為 G80.0–G80.4');

      <li>Late talker：3 歲以前，70–80% 在 4 歲前追上。DLD（F80.9）：3 歲以後；4 歲仍有困難多會持續到學齡。</li>
      <li>Speech sound disorder（F80.0）：4 歲應 90–100% 可被聽懂，8 歲語音成熟。</li><li>口吃（F80.81）：多在 2–7 歲；75–80% 青春期前自癒，持續到 8–10 歲易成慢性。</li>
      <li>SCD（F80.82）、SLD（F81）：學齡才診斷。</li><li>ASD（F84.0）：2 歲可診斷，3–5 歲為診斷高峰。</li><li>ADHD（F90）：4 歲後診斷，症狀 12 歲前出現。</li><li>DCD（F82）：4 歲以上才診斷。</li></ul></details>
    <details><summary>IDD 嚴重度</summary><div class="tw"><table class="r"><thead><tr><th>代碼</th><th>程度</th><th>IQ</th><th>成年時約等於</th></tr></thead><tbody>
      <tr><td class="n">F70</td><td>Mild</td><td class="n">50–55 至約 70</td><td>9–12 歲</td></tr><tr><td class="n">F71</td><td>Moderate</td><td class="n">35–40 至 50–55</td><td>6–9 歲</td></tr>
      <tr><td class="n">F72</td><td>Severe</td><td class="n">20–25 至 35–40</td><td>3–6 歲</td></tr><tr><td class="n">F73</td><td>Profound</td><td class="n">低於 20–25</td><td>小於 3 歲</td></tr></tbody></table></div></details>
    <details><summary>聲母習得年齡</summary><div class="tw"><table class="r"><thead><tr><th>年齡</th><th>聲母</th><th>口訣</th></tr></thead><tbody>
      <tr><td class="n">3 歲</td><td>ㄅ ㄇ ㄉ ㄋ ㄍ ㄏ</td><td>爸爸媽媽買蛋糕喝牛奶</td></tr><tr><td class="n">4 歲</td><td>ㄆ ㄊ ㄎ ㄌ ㄈ ㄐ</td><td>跑跑跳跳快樂飛機</td></tr><tr><td class="n">4 歲半</td><td>ㄒ ㄑ</td><td>小企鵝</td></tr>
      <tr><td class="n">5 歲</td><td>ㄗ ㄙ</td><td>早安禮拜三</td></tr><tr><td class="n">5 歲半</td><td>ㄘ</td><td>草莓</td></tr><tr><td class="n">6 歲</td><td>ㄓ ㄔ ㄕ ㄖ</td><td>蜘蛛樹上吃肉肉</td></tr></tbody></table></div></details>
    <details><summary>ASD、ADHD 常用量表</summary><ul><li>ASD 篩檢：M-CHAT-R/F（家長填）、SCQ（4 歲以上、心理年齡大於 2 歲）。</li><li>ASD 診斷：ADOS-2（12 個月至成人，直接觀察）、ADI-R（照顧者訪談，問 4–5 歲時表現）。</li><li>ASD 嚴重度：CARS-2（2 歲以上）、SRS-2（T 分數）。</li><li>ADHD：SNAP-IV（家長與老師）、CPT、WISC-V 的工作記憶與處理速度。</li></ul></details>
    <details><summary>下肢正常值與判讀</summary><ul>
      <li>Neck-shaft angle：出生 160° → 5 歲 140° → 成人 120–130°。</li><li>Femoral anteversion：1 歲前 39° → 2 歲 31° → 10 歲 24° → 16 歲 16°。<span class="fix">過大容易內八，過小容易外八。</span></li>
      <li>膝：2 歲前 O 型 → 2 歲變直 → 約 4 歲 X 型 → 11 歲前慢慢變直。膝間距 &gt; 4 cm 為 O 型腿；踝間距 &gt; 9–10 cm 為 X 型腿。</li>
      <li>Thigh-foot angle：兒童 5–10°，青少年 15°。Foot progression angle −5 至 +20°。Fick angle 5–18°。</li>
      <li>內八 4 歲前可正常。Hip IR &gt; 70° 且 ER &lt; 20°：股骨前傾；thigh-foot angle 內轉 &gt; 10°：脛骨內轉；heel bisector 落在外側趾：metatarsus adductus。</li>
      <li>O 型腿 MD angle &gt; 11° 為病理性；&gt; 16° 或持續惡化用輔具，3 歲後考慮手術且不超過 4 歲。</li>
      <li>扁平足：2 歲前不一定看得到足弓，6–8 歲成熟。Navicular drop ≥ 1 cm；too many toes 超過 2 趾（單側要想 TP）；踮腳沒有足弓為 rigid。</li>
      <li>墊腳尖：3 歲以下正常，多數 6 歲前改善，6 歲後較難自癒。</li><li>長短腳：差 2 cm 以上。2–4 cm shoe lift、guided growth、epiphysiodesis；4–20 cm lengthening。</li></ul></details>
    <details><summary>脊柱側彎</summary><ul><li>定義：冠狀面 Cobb ≥ 10°。&lt; 20° 運動；20–40° 背架（T7 以上 Milwaukee，T8 以下 Boston、Chêneau，夜用 Charleston）；&gt; 40° 手術。</li>
      <li><span class="fix">胸椎側彎 Cobb &gt; 100° 會限制胸腔擴張，需做肺功能。</span></li><li>骨骼成熟：Risser 4（女）、5（男），或初經後兩年。</li><li>易惡化：12 歲前發生、初經前、Risser &lt; 2、Cobb &gt; 20° 的女生。</li></ul></details>
  </div></section>`;
}
function addTest(line,btn){ S.tests.push(line); S.on.tests=true; save(); renderForm(); btn.textContent='已加入'; btn.disabled=true; }
$('#v-tools').addEventListener('input',e=>{ const t=e.target;
  if(t.id==='dq-da'||t.id==='dq-ca'||t.id==='dq-lb'){ const da=+$('#dq-da').value, ca=+$('#dq-ca').value, o=$('#dq-out');
    if(!da||!ca){o.innerHTML='';return;} const dq=Math.round(da/ca*100), z=(dq-100)/15, b=band(z);
    o.innerHTML=`<b>DQ ${dq}</b><span class="badge ${b[0]}">${b[1]}</span><span class="suf">約 PR ${Math.round(Phi(z)*100)}</span><button class="btn sm pri" data-line="${esc(($('#dq-lb').value||'Developmental quotient')+`: DA ${da}m / CA ${ca}m, DQ ${dq}`)}">加入病歷</button>`; }
  else if(t.id==='cv-val'||t.id==='cv-type'){ const v=parseFloat($('#cv-val').value), ty=$('#cv-type').value, o=$('#cv-out'); if(isNaN(v)){o.innerHTML='';return;}
    const z=ty==='std'?(v-100)/15:ty==='t'?(v-50)/10:ty==='sc'?(v-10)/3:ty==='z'?v:invPhi(Math.min(99.99,Math.max(0.01,v))/100), b=band(z), pr=Phi(z)*100;
    o.innerHTML=`<span class="badge ${b[0]}">${b[1]}</span><span>z <b>${z.toFixed(2)}</b></span><span>PR <b>${pr<1?pr.toFixed(1):Math.round(pr)}</b></span><span>標準分數 <b>${Math.round(100+15*z)}</b></span><span>T <b>${Math.round(50+10*z)}</b></span><span>量尺 <b>${Math.round(10+3*z)}</b></span>`; }
  else if(t.dataset.tool||/^tl-/.test(t.id)){ const id=t.dataset.tool||t.id.slice(3), T=TOOLS.find(x=>x.id===id), v=parseFloat($('#tv-'+id).value), o=$('#to-'+id); if(isNaN(v)){o.innerHTML='';return;}
    const r=T.f(v), lb=$('#tl-'+id).value.trim();
    o.innerHTML=`<span class="badge ${r[0]}">${{delay:'遲緩',border:'臨界',watch:'正常中下',normal:'正常'}[r[0]]}</span><span class="suf">${r[1]}</span><button class="btn sm pri" data-line="${esc(`${T.n}${lb?' '+lb:''}: ${T.unit} ${v}, ${STLBL[r[0]]} (${r[1].replace(/（.*）/,'')})`)}">加入病歷</button>`; }
});
$('#v-tools').addEventListener('change',e=>{ if(e.target.id==='cv-type') e.target.dispatchEvent(new Event('input',{bubbles:true})); });
$('#v-tools').addEventListener('click',e=>{ const b=e.target.closest('[data-line]'); if(b) addTest(b.dataset.line,b); });

/* ---------- routing ---------- */
function route(){ const t=location.hash==='#tools'; $('#v-intake').hidden=t; $('#v-tools').hidden=!t; $('.mbar').style.display=t?'none':'';
  $('#tab-intake').classList.toggle('on',!t); $('#tab-tools').classList.toggle('on',t); if(t) renderTools(); window.scrollTo(0,0); }
window.addEventListener('hashchange',route);
renderForm(); route();
})();

</script>
